<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speedtest Inferno</title>
<meta name="color-scheme" content="dark">
<style>
/* Speedtest Inferno: Hommage an die Ego-Shooter der 90er. Alles (Schrift, Texturen, Figuren) wird im Code erzeugt,
   damit die Seite im Router-LAN ohne Internet genauso aussieht. Bewusst nur dunkel. */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: #0b0604; }
body { margin: 0; color: #e8dcc8; background: #0b0604; font: 16px/1.4 "Courier New", Courier, monospace; min-height: 100vh;
  background-image: radial-gradient(ellipse at 50% -12%, #4a1206 0%, #1a0704 42%, #0b0604 78%); background-attachment: fixed; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 16px 16px 40px; }
.wrap > *, .bar > *, .menu > *, .peaks > *, .slot > * { min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; }
button { font: inherit; }

/* Pixelschrift: jedes Zeichen ist ein Ausschnitt eines im Code gezeichneten Zeichensatzes */
.px { display: inline-block; font-size: 0; line-height: 0; max-width: 100%; vertical-align: top; }
.px .w { display: inline-block; white-space: nowrap; }
.px i { display: inline-block; vertical-align: top; background-repeat: no-repeat; image-rendering: crisp-edges; image-rendering: pixelated; }
.px i.sp { background: none !important; }

/* Kopf */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 20px; margin-bottom: 14px; }
.top h1 { margin: 0; }
.meta { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right; flex: 1 1 320px; max-width: 560px; }
.meta .hr { display: flex; align-items: center; gap: 10px; }
.demo { display: inline-block; border: 2px solid #ff4a2a; background: #2a0804; padding: 4px 6px; box-shadow: 0 0 12px rgba(255,74,42,.45); }

/* Spielfenster */
.game { border: 4px solid #000; background: #000; box-shadow: 0 0 0 2px #5a4a3a, 0 0 0 5px #1a1210, 0 22px 60px rgba(0,0,0,.75); }
.screen { position: relative; height: 320px; height: min(56vh, 58vw); min-height: 230px; overflow: hidden; background: #000; }
#view { display: block; width: 100%; height: 100%; image-rendering: crisp-edges; image-rendering: pixelated; }
.hud { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  padding: 10px 12px; background: rgba(8,3,2,.62); border: 2px solid rgba(120,70,40,.55); }
.hud .row { display: flex; align-items: flex-end; gap: 10px; }
.prog { width: 100%; height: 8px; background: #1a0c08; border: 2px solid #4a2a1a; }
.prog i { display: block; height: 100%; width: 0; background: #ff8a10; box-shadow: 0 0 8px #ff6a00; }

/* Statusleiste */
.bar { display: grid; grid-template-columns: 1.05fr 1.15fr auto 1fr 1fr 1.35fr; gap: 5px; padding: 6px; background-color: #4e4740; border-top: 4px solid #241e1a; background-size: 192px 192px; image-rendering: pixelated; }
.cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px 6px; min-height: 96px;
  background: rgba(20,16,13,.38); border: 3px solid; border-color: #1e1a16 #8c8278 #8c8278 #1e1a16; }
.num { display: flex; align-items: flex-end; gap: 6px; }
.facebox { padding: 4px 8px; background: #1a0f0a; }
#face { display: block; width: 96px; height: 116px; image-rendering: crisp-edges; image-rendering: pixelated; }
.facebox.god { box-shadow: inset 0 0 18px rgba(255,210,60,.65); background: #3a2608; }
.cards { display: flex; gap: 10px; }
.card { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.card b { display: block; width: 30px; height: 20px; border: 2px dashed #5e554c; background: #17120e; }
.card.got b { border-style: solid; border-color: #0c0806; }
.card.got.kp b { background: linear-gradient(#9cc4ff 0 30%, #2f6ae0 30% 70%, #1a3c8a 70%); box-shadow: 0 0 10px #3c7cff; }
.card.got.kd b { background: linear-gradient(#fff2a0 0 30%, #e8b820 30% 70%, #9a7410 70%); box-shadow: 0 0 10px #ffcc33; }
.card.got.ku b { background: linear-gradient(#ffb0a0 0 30%, #e03a20 30% 70%, #8a1a0c 70%); box-shadow: 0 0 10px #ff4a2a; }
.card.new b { animation: blink .16s steps(1) 8; }
@keyframes blink { 50% { opacity: .15; } }
.tbl { display: grid; gap: 6px; width: 100%; padding: 0 4px; }
.tbl div { display: flex; justify-content: space-between; gap: 8px; }

/* Optionen */
.menu { margin-top: 18px; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 14px 16px; align-items: end; padding: 16px;
  background: rgba(24,14,10,.86); border: 3px solid; border-color: #6a5646 #1a100c #1a100c #6a5646; }
.fld { display: flex; flex-direction: column; gap: 9px; }
select, input { font: bold 17px "Courier New", Courier, monospace; color: #ffd860; background: #140c09; border: 3px solid; border-color: #070403 #6a5a4a #6a5a4a #070403;
  padding: 8px 10px; min-height: 46px; border-radius: 0; width: 100%; max-width: 100%; }
select { min-width: 9.5em; }
#go { min-height: 58px; padding: 10px 20px; cursor: pointer; background: #8a1608; border: 4px solid; border-color: #ff6a3a #3a0602 #3a0602 #ff6a3a;
  box-shadow: 0 0 0 2px #000, 0 0 22px rgba(255,80,20,.35); color: #fff; }
#go:hover { background: #a81e0a; }
#go:active { border-color: #3a0602 #ff6a3a #ff6a3a #3a0602; }
#go[disabled] { opacity: .55; cursor: wait; }
#go.stop { background: #3c3834; border-color: #8a8278 #141210 #141210 #8a8278; box-shadow: 0 0 0 2px #000; }
.status { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; min-height: 18px; }
.status::before { content: ""; width: 10px; height: 10px; background: #ff6a10; box-shadow: 0 0 8px #ff6a10; flex: none; }
:focus { outline: none; }
:focus-visible { outline: 3px solid #ffd040 !important; outline-offset: 3px; }
button:focus, select:focus, input:focus { outline: 3px solid #ffd040; outline-offset: 3px; }
button:focus:not(:focus-visible), select:focus:not(:focus-visible) { outline: none; }

/* Level-Abschluss */
#result { position: relative; overflow: hidden; background: #0d0505; }
#fire { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: crisp-edges; image-rendering: pixelated; }
.inter { position: relative; padding: 26px 18px 28px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.box { background: rgba(14,4,2,.82); border: 3px solid; border-color: #7a3a22 #2a0c06 #2a0c06 #7a3a22; padding: 14px 16px; width: 100%; }
.peaks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 820px; }
.pk { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.tally { max-width: 620px; display: grid; gap: 10px; }
.tally div { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.rank { max-width: 820px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.note { border-color: #ff6a3a #4a0c04 #4a0c04 #ff6a3a; background: rgba(60,6,2,.9); max-width: 820px; }

/* Spielstaende */
.saves { margin-top: 30px; }
.saves-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.btn { cursor: pointer; padding: 9px 14px; background: #2a1c14; border: 3px solid; border-color: #7a6050 #120a06 #120a06 #7a6050; color: #fff; min-height: 42px; }
.btn:hover { background: #3a2618; }
.btn.yes { background: #7a1408; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.slot { display: grid; grid-template-columns: 150px minmax(0, 1.5fr) .6fr 1.15fr 1.15fr; gap: 10px 14px; align-items: start; padding: 12px 14px;
  background: rgba(26,18,14,.9); border: 3px solid; border-color: #5a4a3c #140c08 #140c08 #5a4a3c; }
.slot.best { border-color: #c89a30 #3a2808 #3a2808 #c89a30; background: rgba(40,28,10,.92); }
.slot > div { display: flex; flex-direction: column; gap: 7px; }
.empty { padding: 18px; background: rgba(26,18,14,.9); border: 3px solid #2a1c14; }
.foot { margin-top: 26px; text-align: center; opacity: .8; }

@media (max-width: 699px) {
  .wrap { padding: 12px 12px 32px; }
  .meta { align-items: flex-start; text-align: left; }
  .screen { height: min(52vh, 86vw); }
  .bar { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-areas: "ammo face health" "armor face keys" "tbl tbl tbl"; }
  #c-ammo { grid-area: ammo; } #c-health { grid-area: health; } #c-face { grid-area: face; } #c-armor { grid-area: armor; } #c-keys { grid-area: keys; } #c-tbl { grid-area: tbl; }
  .bar { gap: 4px; padding: 4px; }
  .cell { min-height: 74px; padding: 8px 1px; }
  #face { width: 64px; height: 77px; }
  .facebox { padding: 3px 4px; }
  .cards { gap: 6px; }
  .card b { width: 22px; height: 15px; }
  .tbl { grid-template-columns: 1fr 1fr; column-gap: 18px; }
  .hud { right: 6px; bottom: 6px; padding: 7px 8px; gap: 6px; }
  .menu { grid-template-columns: 1fr 1fr; padding: 12px; }
  .fld.lab, #go { grid-column: 1 / -1; }
  select { min-width: 0; }
  .inter { padding: 20px 10px 22px; gap: 14px; }
  .box { padding: 12px 10px; }
  .peaks { gap: 8px; }
  .slot { grid-template-columns: 1fr 1fr; padding: 10px; }
  .slot .who { grid-column: 1 / -1; order: -1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span class="px" data-st="fire" data-s="5" data-m="3" data-t="Speedtest Inferno"></span></h1>
    <div class="meta">
      <div class="hr"><span class="px" id="host" data-st="gold" data-s="3" data-m="2"></span>
      <span class="demo" id="demo" hidden><span class="px" data-st="red" data-s="2" data-t="Demo"></span></span></div>
      <span class="px" id="meta" data-st="gray" data-s="2" data-m="2"></span>
    </div>
  </header>

  <main class="game">
    <div class="screen" id="screen">
      <canvas id="view" aria-hidden="true"></canvas>
      <div class="hud" id="hud" hidden>
        <div class="row"><span class="px" id="spd" data-st="red" data-s="7" data-m="4"></span><span class="px" id="spdu" data-st="gold" data-s="3" data-m="2"></span></div>
        <span class="px" id="spdl" data-st="gray" data-s="2" data-m="2" data-t="Spitze"></span>
        <span class="px" id="spdp" data-st="gold" data-s="2" data-m="2"></span>
        <div class="prog"><i id="progf"></i></div>
      </div>
    </div>
    <section id="result" hidden aria-labelledby="r-title">
      <canvas id="fire" aria-hidden="true"></canvas>
      <div class="inter">
        <h2 id="r-title" style="margin:0"><span class="px" data-st="fire" data-s="6" data-m="3" data-t="Ebene abgeschlossen"></span></h2>
        <span class="px" data-st="gold" data-s="2" data-m="2" data-t="Datenbasis und Rückkanal gesäubert"></span>
        <div class="peaks">
          <div class="box pk">
            <span class="px" data-st="gold" data-s="2" data-m="2" data-t="Download · Spitze"></span>
            <span class="px" id="r-dl" data-st="red" data-s="8" data-m="5"></span>
            <span class="px" id="r-dlu" data-st="gold" data-s="3" data-m="2"></span>
            <span class="px" id="r-dla" data-st="white" data-s="2" data-m="2"></span>
          </div>
          <div class="box pk">
            <span class="px" data-st="gold" data-s="2" data-m="2" data-t="Upload · Spitze"></span>
            <span class="px" id="r-ul" data-st="red" data-s="8" data-m="5"></span>
            <span class="px" id="r-ulu" data-st="gold" data-s="3" data-m="2"></span>
            <span class="px" id="r-ula" data-st="white" data-s="2" data-m="2"></span>
          </div>
        </div>
        <div class="box tally" id="tally"></div>
        <div class="box rank">
          <span class="px" data-st="gray" data-s="2" data-m="2" data-t="Rang"></span>
          <span class="px" id="r-rank" data-st="fire" data-s="4" data-m="3"></span>
          <span class="px" id="r-vt" data-st="gold" data-s="3" data-m="2"></span>
          <span class="px" id="r-vs" data-st="white" data-s="2" data-m="2"></span>
        </div>
        <div class="box note" id="r-note" hidden><span class="px" data-st="white" data-s="2" data-m="2" data-t="Ein Prozessorkern des Routers war voll ausgelastet. Das Ergebnis zeigt eher die Grenze des Routers als die des Netzes."></span></div>
      </div>
    </section>

    <div class="bar" id="bar">
      <div class="cell" id="c-ammo"><div class="num"><span class="px" id="ammo" data-st="red" data-s="5" data-m="4"></span><span class="px" data-st="red" data-s="2" data-m="2" data-t="GB"></span></div><span class="px" data-st="gray" data-s="2" data-m="2" data-t="Munition"></span></div>
      <div class="cell" id="c-health"><span class="px" id="health" data-st="red" data-s="5" data-m="4"></span><span class="px" data-st="gray" data-s="2" data-m="2" data-t="Gesundheit"></span></div>
      <div class="cell facebox" id="c-face"><canvas id="face" width="24" height="29" role="img" aria-label="Gesicht des Helden"></canvas></div>
      <div class="cell" id="c-armor"><span class="px" id="armor" data-st="red" data-s="5" data-m="4"></span><span class="px" data-st="gray" data-s="2" data-m="2" data-t="Rüstung"></span></div>
      <div class="cell" id="c-keys">
        <div class="cards">
          <div class="card kp" id="k-ping"><b></b><span class="px" data-st="gray" data-s="1" data-m="1" data-t="Ping"></span></div>
          <div class="card kd" id="k-download"><b></b><span class="px" data-st="gray" data-s="1" data-m="1" data-t="Down"></span></div>
          <div class="card ku" id="k-upload"><b></b><span class="px" data-st="gray" data-s="1" data-m="1" data-t="Up"></span></div>
        </div>
        <span class="px" data-st="gray" data-s="2" data-m="2" data-t="Karten"></span>
      </div>
      <div class="cell" id="c-tbl">
        <div class="tbl">
          <div><span class="px" data-st="gray" data-s="2" data-m="2" data-t="Ping"></span><span class="px" id="t-ping" data-st="gold" data-s="2" data-m="2"></span></div>
          <div><span class="px" data-st="gray" data-s="2" data-m="2" data-t="Jitter"></span><span class="px" id="t-jit" data-st="gold" data-s="2" data-m="2"></span></div>
          <div><span class="px" data-st="gray" data-s="2" data-m="2" data-t="Down"></span><span class="px" id="t-dl" data-st="gold" data-s="2" data-m="2"></span></div>
          <div><span class="px" data-st="gray" data-s="2" data-m="2" data-t="Up"></span><span class="px" id="t-ul" data-st="gold" data-s="2" data-m="2"></span></div>
        </div>
      </div>
    </div>
  </main>

  <section class="menu" aria-label="Optionen">
    <label class="fld" for="duration"><span class="px" data-st="gray" data-s="2" data-m="2" data-t="Dauer"></span>
      <select id="duration"><option value="5">5 Sekunden</option><option value="10" selected>10 Sekunden</option><option value="20">20 Sekunden</option></select></label>
    <label class="fld" for="streams"><span class="px" data-st="gray" data-s="2" data-m="2" data-t="Verbindungen"></span>
      <select id="streams"><option value="1">1</option><option value="2">2</option><option value="4" selected>4</option><option value="6">6</option><option value="8">8</option></select></label>
    <label class="fld lab" for="label"><span class="px" data-st="gray" data-s="2" data-m="2" data-t="Gerätename"></span>
      <input id="label" maxlength="40" placeholder="z. B. Laptop Kabel" autocomplete="off"></label>
    <button id="go" disabled><span class="px" id="go-t" data-st="white" data-s="3" data-m="3" data-t="Messung starten"></span></button>
    <div class="status" aria-live="polite"><span class="px" id="status" data-st="gold" data-s="2" data-m="2" data-t="Lade Karte …"></span></div>
  </section>

  <section class="saves" aria-labelledby="h-saves">
    <div class="saves-h">
      <h2 id="h-saves" style="margin:0"><span class="px" data-st="fire" data-s="4" data-m="3" data-t="Spielstände"></span></h2>
      <div id="clear-wrap"></div>
    </div>
    <div id="history"></div>
  </section>
  <p class="foot"><span class="px" data-st="gray" data-s="1" data-m="1" data-t="Eine Hommage an die Ego-Shooter der 90er. Schrift, Texturen und Held sind im Code gezeichnet."></span></p>
</div>

<script src="engine.js"></script>

      var src = y * FW + x, p = fpix[src];
      if (!p) { fpix[src - FW] = 0; continue; }
      var rnd = (Math.random() * 4) | 0, dst = src - rnd + 1;
      if (dst - FW >= 0) fpix[dst - FW] = Math.max(0, p - (rnd & 1));
    }
    for (var i = 0; i < fpix.length; i++) fbuf[i] = FPAL[fpix[i]];
    fctx.putImageData(fimg, 0, 0);
  }

  // =====================================================================
  // Spiel-Logik und Anzeige
  // =====================================================================
  var running = false, res = {}, opts = null, tStart = 0, pingN = 0, healthV = null, lastHud = 0, tally = null;
  function velFor(m) { return 1.0 + 7.4 * Math.sqrt(Math.min(m, 10000) / 2500); }
  function update(dt) {
    var t = S.t;
    S.disp += (S.tgt - S.disp) * (1 - Math.exp(-dt * 5));
    if (S.disp > S.peak) S.disp = S.peak;
    var vt = 0.9;
    if (S.phase === 'ping') vt = 0.35;
    else if (S.phase === 'download' || S.phase === 'upload') vt = S.live === null ? 1.4 : velFor(S.disp);
    else if (S.phase === 'outro' || S.phase === 'done') vt = 0;
    S.v += (vt - S.v) * (1 - Math.exp(-dt * 2.5));
    S.camX += S.v * dt; if (S.camX > 1040) S.camX -= 1024;
    S.camY = 2.5 + 0.12 * Math.sin(t * 0.37);
    S.bob += dt * (2.2 + S.v * 1.15);
    S.flash = Math.max(0, S.flash - dt * 2.2); S.boost = Math.max(0, S.boost - dt * 4); S.kick = Math.max(0, S.kick - dt * 40);
    // Ping-Schüsse nacheinander abspielen
    var gap = S.phase === 'ping' ? 0.09 : 0.045;
    if (S.shots.length && t - S.lastShot > gap) {
      var ms = S.shots.shift(); S.lastShot = t; S.fireT = t; S.kick = 4; S.boost = RM ? 0 : 0.28; S.droneHit = t;
      var ds = S.droneScr || [W / 2, H * 0.42];
      S.hits.push({ txt: E.fmt(ms, 1) + ' ms', x: ds[0], y: ds[1] + 8, t0: t });
      if (!RM) for (var i = 0; i < 6; i++) S.sparks.push({ x: ds[0], y: ds[1], vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.8) * 50, life: 0.35, c: Math.random() < 0.5 ? '#ffd040' : '#ff7a10' });
      if (S.hits.length > 6) S.hits.shift();
    }
    for (var j = S.sparks.length - 1; j >= 0; j--) { var s = S.sparks[j]; s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 120 * dt; if (s.life <= 0) S.sparks.splice(j, 1); }
    for (j = S.hits.length - 1; j >= 0; j--) if (t - S.hits[j].t0 > 1.6) S.hits.splice(j, 1);
    for (j = S.msgs.length - 1; j >= 0; j--) if (t - S.msgs[j].t0 > 4) S.msgs.splice(j, 1);
    if (t > S.nextLook) { S.look = [-1, 0, 0, 1][(Math.random() * 4) | 0]; S.nextLook = t + 1.2 + Math.random() * 2.2; }
    updFace();
  }
  function updFace() {
    var ex = 'idle', hurt = healthV !== null && healthV <= 10;
    if (S.phase === 'ping') ex = 'grim';
    else if (S.phase === 'download' || S.phase === 'upload') ex = S.live === null ? 'grim' : S.disp >= 2000 ? 'god' : S.disp < 250 ? 'strain' : 'grim';
    else if (S.phase === 'outro' || S.phase === 'done') { var dl = res.download ? res.download.peak : 0; ex = dl >= 2000 ? 'god' : dl >= 600 ? 'grin' : dl >= 90 ? 'grim' : 'strain'; }
    else if (S.phase === 'abort') ex = 'ouch';
    drawFace(ex, ex === 'god' || ex === 'grin' ? 0 : S.look, hurt);
  }
  function hud(force) {
    var now = S.t;
    if (!force && now - lastHud < 0.12) return; lastHud = now;
    var on = S.phase === 'ping' || S.phase === 'download' || S.phase === 'upload';
    $('hud').hidden = !on;
    if (!on) return;
    if (S.phase === 'ping') {
      px($('spd'), S.lastPing === undefined ? '…' : E.fmt(S.lastPing, 1)); px($('spdu'), 'ms'); px($('spdl'), 'Probe'); px($('spdp'), Math.min(pingN, 20) + ' / 20');
      $('progf').style.width = Math.round(Math.min(pingN, 20) / 20 * 100) + '%';
    } else {
      if (S.live === null || S.peak <= 0) { px($('spd'), '…'); px($('spdu'), 'Mbit/s'); }
      else { var s = E.fmtSpeed(S.disp); px($('spd'), s.v); px($('spdu'), s.u); }
      px($('spdl'), 'Spitze');
      if (S.peak > 0) { var pk = E.fmtSpeed(S.peak); px($('spdp'), pk.v + ' ' + pk.u); } else px($('spdp'), '–');
      $('progf').style.width = Math.round(S.prog * 100) + '%';
    }
    px($('ammo'), E.fmt(S.ammo, S.ammo < 10 ? 2 : 1));
  }
  function setStatus(t) { px($('status'), t); }
  function setGo(t, stop) { px($('go-t'), t); $('go').className = stop ? 'stop' : ''; }
  function cardGet(id) {
    var el = $('k-' + id); el.className = el.className.replace(/\s*(got|new)/g, '') + ' got new';
    setTimeout(function () { el.className = el.className.replace(/\s*new/g, ''); }, 1500);
  }
  function cardsReset() { ['ping', 'download', 'upload'].forEach(function (k) { var el = $('k-' + k); el.className = el.className.replace(/\s*(got|new)/g, ''); }); }
  function setTbl(id, v) { px($(id), v); }

  // Einordnung nach Netzwerkklassen (Nettodurchsatz liegt ~6 % unter der Leitungsrate)
  function verdict(dl) {
    if (dl >= 4700) return ['Über 5 Gbit/s', 'Das schafft nur eine 10-GbE-Strecke.', 'Gottmodus'];
    if (dl >= 2000) return ['2,5 Gbit/s ausgeschöpft', 'Die 2,5-GbE-Verbindung läuft nahe am Maximum.', 'Albtraum bezwungen'];
    if (dl >= 940) return ['Mehr als Gigabit', 'Schneller als 1 GbE, also 2,5 GbE oder schnelles WLAN.', 'Ultrabrutal'];
    if (dl >= 600) return ['Gigabit-Klasse', 'Typisch für 1-GbE-Kabel oder gutes WLAN 6/7.', 'Harter Brocken'];
    if (dl >= 90) return ['Ordentlich', 'Typisch für WLAN mit Abstand oder 100-Mbit-Kabel.', 'Leichtes Gefecht'];
    return ['Langsam', 'Kabel, Port oder WLAN-Empfang prüfen.', 'Noch im Training'];
  }

  function resetView() {
    S.tgt = 0; S.disp = 0; S.peak = 0; S.prog = 0; S.live = null; S.ammo = 0; S.shots = []; S.hits = []; S.msgs = []; S.lastPing = undefined;
    healthV = null; pingN = 0; res = {};
    px($('ammo'), '0,00'); px($('health'), '100%'); px($('armor'), '–');
    setTbl('t-ping', '–'); setTbl('t-jit', '–'); setTbl('t-dl', '–'); setTbl('t-ul', '–');
    cardsReset();
  }
  function start() {
    var streams = +$('streams').value, duration = +$('duration').value, label = $('label').value.replace(/^\s+|\s+$/g, '');
    try { localStorage.setItem('st-label', label); localStorage.setItem('st-streams', streams); localStorage.setItem('st-duration', duration); } catch (e) { }
    opts = { streams: streams, duration: duration };
    tally = null;
    var wasResult = !$('result').hidden;
    $('result').hidden = true; $('screen').hidden = false;
    if (wasResult) { sizeView(); window.scrollTo(0, 0); }
    resetView();
    running = true; tStart = Date.now();
    setGo('Stopp', true);
    startMelt();
    if (narrow() && $('screen').scrollIntoView) $('screen').scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' });
    S.phase = 'ping'; S.level = 'tech';
    S.banner = { txt: 'Zielübung: Ping', sub: '20 Schuss auf die Paket-Drohne', t0: S.t, dur: 2.2 };
    setStatus('Ping: Ziel erfassen …');
    E.run({ streams: streams, duration: duration, label: label }, {
      phase: function (p) {
        if (p === 'ping') return;
        startMelt();
        S.phase = p; S.tgt = 0; S.disp = 0; S.peak = 0; S.live = null; S.prog = 0;
        if (p === 'download') {
          S.level = 'tech'; S.banner = { txt: 'Ebene 1: Datenbasis', sub: 'Download', t0: S.t, dur: 2.6, keep: 'E1 Datenbasis' };
          setStatus('Ebene 1: Datenbasis (Download)');
        } else {
          S.level = 'hell'; S.banner = { txt: 'Ebene 2: Rückkanal', sub: 'Upload', t0: S.t, dur: 2.6, keep: 'E2 Rückkanal' };
          setStatus('Ebene 2: Rückkanal (Upload)');
        }
        hud(true);
      },
      pingSample: function (ms) { pingN++; S.lastPing = ms; S.shots.push(ms); if (S.shots.length > 24) S.shots.shift(); hud(true); },
      ping: function (p, j) {
        res.ping = p; res.jitter = j; res.pingN = pingN;
        var armor = Math.round(clamp(100 - (p - 0.5) * 8 - j * 4, 0, 100));
        px($('armor'), armor + '%');
        setTbl('t-ping', E.fmt(p, p < 10 ? 1 : 0) + ' ms'); setTbl('t-jit', E.fmt(j, 1) + ' ms');
        cardGet('ping'); msg('Ping-Karte eingesammelt', 'gold'); msg('Ping ' + E.fmt(p, 1) + ' ms, Jitter ' + E.fmt(j, 1) + ' ms');
        S.flash = RM ? 0 : 0.8; S.flashCol = '90,140,255';
      },
      live: function (kind, m, p) {
        S.prog = p || 0;
        if (m === null) return;
        S.live = m; S.tgt = m; if (m > S.peak) S.peak = m;
        S.ammo += m * 0.2 / 8 / 1000;
      },
      result: function (kind, r) {
        res[kind] = r;
        var s = E.fmtSpeed(r.peak);
        setTbl(kind === 'download' ? 't-dl' : 't-ul', s.v + ' ' + (s.u === 'Gbit/s' ? 'G' : 'M'));
        if (r.core !== null && r.core !== undefined) {
          var hv = Math.round(clamp(100 - r.core, 0, 100));
          healthV = healthV === null ? hv : Math.min(healthV, hv);
          px($('health'), healthV + '%');
          if (r.core >= 90) msg('Router-Kern am Limit!', 'red');
        }
        cardGet(kind);
        msg((kind === 'download' ? 'Download' : 'Upload') + '-Karte eingesammelt', 'gold');
        S.flash = RM ? 0 : 0.9; S.flashCol = kind === 'download' ? '255,210,60' : '255,80,40';
      },
      done: function (rec) {
        running = false; S.endT = Date.now();
        setGo('Neu messen', false);
        setStatus('Ebene abgeschlossen');
        startMelt(); S.phase = 'outro'; S.banner = null;
        hud(true);
        setTimeout(function () { if (S.phase === 'outro') showResult(rec); }, RM ? 50 : 1100);
      },
      error: function (msgTxt) {
        running = false; S.phase = 'abort'; setGo('Neu messen', false); setStatus(msgTxt); hud(true);
      }
    });
  }
  function stopRun() {
    E.stop(); running = false;
    S.phase = 'abort'; S.banner = null; S.shots = []; S.msgs = []; S.hits = [];
    setGo('Neu messen', false); setStatus('Abgebrochen'); hud(true);
  }

  function showResult(rec) {
    S.phase = 'done';
    var d = res.download, u = res.upload, sd = E.fmtSpeed(d.peak), su = E.fmtSpeed(u.peak), ad = E.fmtSpeed(d.avg), au = E.fmtSpeed(u.avg);
    px($('r-dl'), sd.v); px($('r-dlu'), sd.u); px($('r-dla'), 'Ø ' + ad.v + ' ' + ad.u);
    px($('r-ul'), su.v); px($('r-ulu'), su.u); px($('r-ula'), 'Ø ' + au.v + ' ' + au.u);
    var v = verdict(d.peak);
    px($('r-rank'), v[2]); px($('r-vt'), v[0]); px($('r-vs'), v[1]);
    var core = Math.max(d.core || 0, u.core || 0), hasCore = d.core !== null && d.core !== undefined;
    $('r-note').hidden = !(core >= 90);
    var secs = Math.round((S.endT - tStart) / 1000), par = opts.duration * 2 + 3;
    function mmss(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
    var konst = Math.round(((d.peak ? d.avg / d.peak : 0) + (u.peak ? u.avg / u.peak : 0)) * 50);
    var rows = [
      ['Treffer', Math.round(100 * Math.min(res.pingN || 0, 20) / 20), function (x) { return Math.round(x) + '%'; }],
      ['Konstanz', konst, function (x) { return Math.round(x) + '%'; }],
      ['Reserve', hasCore ? 100 - Math.round(core) : null, function (x) { return Math.round(x) + '%'; }],
      ['Ping', res.ping, function (x) { return E.fmt(x, 1) + ' ms'; }],
      ['Jitter', res.jitter, function (x) { return E.fmt(x, 1) + ' ms'; }],
      ['CPU-Kern', hasCore ? Math.round(core) : null, function (x) { return Math.round(x) + ' %'; }],
      ['Zeit', secs, function (x) { return mmss(Math.round(x)); }],
      ['Par', par, function (x) { return mmss(Math.round(x)); }]
    ];
    var h = '';
    for (var i = 0; i < rows.length; i++) h += '<div><span class="px" data-st="gold" data-s="3" data-m="2" data-t="' + rows[i][0] + '"></span><span class="px" id="ty' + i + '" data-st="red" data-s="3" data-m="2"></span></div>';
    $('tally').innerHTML = h;
    tally = { rows: rows, t0: S.t, i: 0 };
    for (i = 0; i < rows.length; i++) px($('ty' + i), rows[i][1] === null || rows[i][1] === undefined ? '–' : rows[i][2](0));
    $('screen').hidden = true; $('result').hidden = false;
    pxAll(); sizeFire();
    if (RM) finishTally();
    $('result').scrollIntoView ? $('result').scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }) : 0;
    loadHistory();
  }
  function tallyStep(all) {
    if (!tally) return;
    var per = 0.22, el = all ? 1e6 : S.t - tally.t0, idx = Math.floor(el / per);
    for (var i = 0; i < tally.rows.length; i++) {
      var row = tally.rows[i]; if (row[1] === null || row[1] === undefined) continue;
      var k = clamp((el - i * per) / per, 0, 1);
      if (k > 0) px($('ty' + i), row[2](row[1] * k));
    }
    if (idx > tally.rows.length + 1) tally = null;
  }
  function finishTally() { tallyStep(true); tally = null; }

  // ---------- Spielstände ----------
  function n0(v) { return v === null || v === undefined ? '–' : E.fmt(v, 0); }
  function loadHistory() {
    E.history(function (hs) {
      if (!hs.length) { $('history').innerHTML = '<div class="empty"><span class="px" data-st="gray" data-s="2" data-m="2" data-t="Noch keine Spielstände. Starte die erste Messung."></span></div>'; pxAll(); clearReset(true); return; }
      var best = -1, bv = -1;
      for (var b = 0; b < hs.length; b++) { var pv = hs[b].dl_peak !== null && hs[b].dl_peak !== undefined ? hs[b].dl_peak : hs[b].dl; if (pv > bv) { bv = pv; best = b; } }
      var h = '<ol class="slots">';
      function cellH(k, v, st, cls) { return '<div' + (cls ? ' class="' + cls + '"' : '') + '><span class="px" data-st="gray" data-s="1" data-m="1" data-t="' + esc(k) + '"></span><span class="px" data-st="' + st + '" data-s="2" data-m="2" data-t="' + esc(v) + '"></span></div>'; }
      for (var i = hs.length - 1; i >= 0; i--) {
        var e = hs[i], d = new Date(e.ts * 1000);
        var when = ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '. ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        var who = e.label || e.host || e.ip || '?', sub = e.label && e.host ? e.host : (e.ip || '');
        h += '<li class="slot' + (i === best ? ' best' : '') + '">' +
          cellH('Slot ' + (hs.length - i) + (i === best ? ' · Bestwert' : ''), when, i === best ? 'gold' : 'white') +
          '<div class="who"><span class="px" data-st="gray" data-s="1" data-m="1" data-t="' + esc('Gerät' + (sub ? ' · ' + sub : '')) + '"></span><span class="px" data-st="gold" data-s="2" data-m="2" data-t="' + esc(who) + '"></span></div>' +
          cellH('Ping ms', e.ping === null || e.ping === undefined ? '–' : E.fmt(e.ping, 1), 'white') +
          cellH('Down Mbit/s Spitze / Ø', (e.dl_peak === null || e.dl_peak === undefined ? '' : n0(e.dl_peak) + ' / ') + n0(e.dl), 'red') +
          cellH('Up Mbit/s Spitze / Ø', (e.ul_peak === null || e.ul_peak === undefined ? '' : n0(e.ul_peak) + ' / ') + n0(e.ul), 'red') + '</li>';
      }
      $('history').innerHTML = h + '</ol>';
      pxAll(); clearReset();
    });
  }
  // Löschen mit Rückfrage direkt auf der Seite
  function clearAsk() {
    $('clear-wrap').innerHTML = '<span class="confirm"><span class="px" data-st="gold" data-s="2" data-m="2" data-t="Alle Spielstände löschen?"></span><button class="btn yes" id="yes"><span class="px" data-st="white" data-s="2" data-t="Ja"></span></button><button class="btn" id="no"><span class="px" data-st="white" data-s="2" data-t="Nein"></span></button></span>';
    pxAll();
    $('yes').onclick = function () { E.clearHistory(function () { loadHistory(); }); };
    $('no').onclick = function () { clearReset(); $('clear').focus(); };
    $('no').focus();
  }
  function clearReset(empty) {
    $('clear-wrap').innerHTML = empty ? '' : '<button class="btn" id="clear"><span class="px" data-st="white" data-s="2" data-t="Löschen"></span></button>';
    if (!empty) { pxAll(); $('clear').onclick = clearAsk; }
  }

  // ---------- Statusleisten-Textur ----------
  (function barTex() {
    var c = mkc(64, 64), g = c.getContext('2d'), id = g.createImageData(64, 64), b32 = new Uint32Array(id.data.buffer);
    for (var y = 0; y < 64; y++) for (var x = 0; x < 64; x++) {
      var n = fbm(x / 64, y / 64, 101), v = 58 + n * 46 + (hsh(x, y, 103) > 0.92 ? 12 : 0);
      if (Math.abs(fbm(x / 64, y / 64, 107) - 0.5) < 0.012) v -= 26;
      b32[y * 64 + x] = C(v * 1.05, v * 0.97, v * 0.86);
    }
    g.putImageData(id, 0, 0);
    try { $('bar').style.backgroundImage = 'url(' + c.toDataURL() + ')'; } catch (e) { }
  })();

  // ---------- Hauptschleife ----------
  var lastTs = 0;
  function loop(ts) {
    window.requestAnimationFrame(loop);
    if (document.hidden) return;
    var fps = RM ? 4 : (S.phase === 'idle' || S.phase === 'abort') ? 20 : S.phase === 'done' ? 24 : 35;
    if (ts - lastTs < 1000 / fps - 3) return;
    var dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0.016; lastTs = ts;
    S.t += dt;
    update(dt);
    if (S.phase === 'done') { fireStep(); tallyStep(); }
    else if (ctx && !$('screen').hidden) render();
    hud(false);
  }

  // ---------- Start ----------
  $('go').onclick = function () { if (running) stopRun(); else start(); };
  try {
    var ls = localStorage.getItem('st-label'), ss = localStorage.getItem('st-streams'), sd = localStorage.getItem('st-duration');
    if (ls) $('label').value = ls; if (ss) $('streams').value = ss; if (sd) $('duration').value = sd;
  } catch (e) { }
  buildTextures(); buildSprites();
  resetView(); pxAll(); sizeView(); updFace();
  var rsT = null, wasNarrow = narrow();
  window.addEventListener('resize', function () {
    clearTimeout(rsT);
    rsT = setTimeout(function () { if (narrow() !== wasNarrow) { wasNarrow = narrow(); pxAll(); } if (!$('screen').hidden) sizeView(); if (!$('result').hidden) sizeFire(); }, 150);
  });
  if (RM) { S.v = 0; }
  window.requestAnimationFrame(loop);

  E.init(function (info) {
    px($('host'), info.hostname || 'Router');
    px($('meta'), (info.model ? info.model + ' · ' : '') + info.cores + ' Kerne · Du: ' + (info.client_host ? info.client_host + ' (' + info.client_ip + ')' : info.client_ip));
    $('demo').hidden = !info.demo;
    $('go').disabled = false;
    setStatus('Bereit. Wähle Dauer und Verbindungen.');
    loadHistory();
  });
})();
</script>
</body>
