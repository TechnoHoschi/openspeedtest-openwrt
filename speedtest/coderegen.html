<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Speedtest Code-Regen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root {
  --bg: #000; --g: #39ff7a; --g2: #8dffb2; --hi: #d9ffe4; --dim: #4fbf74; --line: #11522a; --panel: rgba(0, 10, 3, .84);
  --blue: #2c6bff; --red: #ff2b3d; --warn: #ffd34d;
  --mono: "Share Tech Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { background: var(--bg); color-scheme: dark; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--g2); font: 16px/1.45 var(--mono); overflow-x: hidden; -webkit-text-size-adjust: 100%; }
@media (min-width: 1700px) { body { font-size: 20px; } .wrap { max-width: 1500px; } }

#rain { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 0; display: block;
  transform-origin: 50% 45%; transition: transform 1.1s cubic-bezier(.2,.7,.2,1), opacity .9s, filter .9s; }
.crt { position: fixed; inset: 0; z-index: 5; pointer-events: none;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.6) 100%);
  animation: flick 5s infinite steps(1); }
.crt::after { content: ""; position: absolute; left: 0; right: 0; height: 22vh; top: -25vh;
  background: linear-gradient(180deg, transparent, rgba(80,255,140,.035), transparent); animation: sweep 9s linear infinite; }
@keyframes flick { 0%, 100% { opacity: 1; } 41% { opacity: .9; } 42% { opacity: 1; } 77% { opacity: .94; } 78% { opacity: 1; } }
@keyframes sweep { to { transform: translateY(130vh); } }

.wrap { position: relative; z-index: 2; width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.wrap > *, .stage > *, .row > * { min-width: 0; }

/* ---------- Kopfzeile ---------- */
.bar { position: relative; background: linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.55)); margin: 0 -16px; padding-left: 16px !important; padding-right: 16px !important; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 14px 0 10px; font-size: .82rem; color: var(--dim); letter-spacing: .06em; }
.bar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--g); box-shadow: 0 0 10px var(--g); animation: blink 2.2s infinite; flex: none; }
.bar b { color: var(--g2); font-weight: 400; text-transform: uppercase; letter-spacing: .14em; }
.bar .meta { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.demo { display: inline-block; color: #001a08; background: var(--g); padding: 0 8px; font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; box-shadow: 0 0 12px rgba(57,255,122,.5); }
@keyframes blink { 50% { opacity: .35; } }

/* ---------- Bühne ---------- */
.stage { min-height: calc(100vh - 54px); display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 10px 0 34px; }
.term { font-size: 1.12rem; color: var(--g2); text-shadow: 0 0 8px rgba(57,255,122,.45); }
.term p { margin: 0 0 4px; min-height: 1.45em; white-space: pre-wrap; overflow-wrap: anywhere; }
.cur::after { content: "\2588"; color: var(--g); margin-left: 1px; animation: blink .9s infinite steps(1); }

#intro { display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: left; }
#intro .term { width: 100%; max-width: 640px; background: var(--panel); border: 1px solid var(--line); padding: 16px 18px; box-shadow: 0 0 40px rgba(0,0,0,.8); }
.pills { display: flex; justify-content: center; align-items: flex-start; gap: 18px 56px; flex-wrap: wrap; }
.or { align-self: center; color: var(--dim); letter-spacing: .3em; font-size: .85rem; padding-top: 0; }
.pill { display: flex; flex-direction: column; align-items: center; gap: 12px; background: none; border: 0; color: var(--g2); font: inherit; cursor: pointer; padding: 10px 14px; width: 220px; max-width: 42vw; }
.pill .cap { position: relative; width: 112px; height: 44px; border-radius: 999px; transition: transform .35s, box-shadow .35s; }
.pill .cap::before { content: ""; position: absolute; left: 14%; top: 14%; width: 44%; height: 26%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0)); }
.pill .cap::after { content: ""; position: absolute; left: 50%; top: 6%; bottom: 6%; width: 1px; background: rgba(0,0,0,.25); }
.pill.blue .cap { background: radial-gradient(ellipse at 40% 25%, #9fc0ff 0, #3a78ff 30%, #0d2e9e 75%, #061650 100%); box-shadow: 0 0 34px rgba(44,107,255,.55), inset 0 -6px 10px rgba(0,0,30,.5); transform: rotate(16deg); }
.pill.red .cap { background: radial-gradient(ellipse at 40% 25%, #ffb0b6 0, #ff3347 30%, #a0001a 75%, #4c0008 100%); box-shadow: 0 0 34px rgba(255,43,61,.55), inset 0 -6px 10px rgba(30,0,0,.5); transform: rotate(-16deg); }
.pill:hover .cap, .pill:focus-visible .cap { transform: rotate(0) scale(1.12); }
.pill.blue:hover .cap { box-shadow: 0 0 54px rgba(44,107,255,.9), inset 0 -6px 10px rgba(0,0,30,.5); }
.pill.red:hover .cap { box-shadow: 0 0 54px rgba(255,43,61,.9), inset 0 -6px 10px rgba(30,0,0,.5); }
.pill .pl { font-size: 1.05rem; letter-spacing: .14em; text-transform: uppercase; }
.pill.blue .pl { color: #9cc0ff; } .pill.red .pl { color: #ff9aa4; }
.pill .ps { color: var(--dim); font-size: .86rem; text-align: center; line-height: 1.3; }
.pill:disabled { opacity: .45; cursor: default; }
.pill:focus-visible { outline: 2px solid var(--hi); outline-offset: 4px; }

/* Live */
#live { display: flex; flex-direction: column; gap: 14px; }
.phase { background: rgba(0,0,0,.78); padding: 6px 10px; border-left: 3px solid var(--g); display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; color: var(--g); letter-spacing: .18em; text-transform: uppercase; font-size: 1rem; text-shadow: 0 0 10px rgba(57,255,122,.6); }
.prog { letter-spacing: 0; color: var(--dim); white-space: nowrap; overflow: hidden; max-width: 100%; }
.slot { height: clamp(150px, 36vh, 400px); width: 100%; }
.readline { align-self: center; max-width: 100%; background: rgba(0,0,0,.82); border: 1px solid var(--line); padding: 6px 16px; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 16px; text-align: center; }
.readline .lv { font-size: 1.6rem; color: var(--hi); text-shadow: 0 0 14px rgba(57,255,122,.8); }
.readline .lu { color: var(--g); letter-spacing: .1em; }
.readline .lp { color: var(--dim); font-size: .92rem; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--panel); }
.stats div { padding: 8px 12px; border-left: 1px solid var(--line); }
.stats div:first-child { border-left: 0; }
.stats span { display: block; color: var(--dim); font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; }
.stats b { font-weight: 400; color: var(--g2); font-size: 1.08rem; }
.console { background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; font-size: .95rem; height: 9.6em; overflow: hidden; }
.console p { margin: 0; color: var(--g2); white-space: pre-wrap; overflow-wrap: anywhere; }
.console p.sys { color: var(--dim); }

/* Ergebnis */
#result { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: center; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.duo .slot { height: clamp(120px, 22vh, 250px); }
@media (min-width: 1000px) {
  #result { grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 28px; }
  .duo .slot { height: clamp(150px, 25vh, 290px); }
}
.duo .cap2 { width: max-content; max-width: 100%; margin: 4px auto 0 !important; background: rgba(0,0,0,.8); padding: 2px 10px; text-align: center; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; font-size: .8rem; margin-top: 4px; }
.duo .cap2 b { color: var(--g2); font-weight: 400; letter-spacing: .04em; text-transform: none; font-size: 1rem; }
.report { background: var(--panel); border: 1px solid var(--line); padding: 16px 20px 18px; box-shadow: 0 0 60px rgba(0,0,0,.9), 0 0 0 1px rgba(57,255,122,.06) inset; }
.report h2 { margin: 0 0 12px; font-weight: 400; font-size: 1.05rem; letter-spacing: .24em; text-transform: uppercase; color: var(--g); }
.glitch { position: relative; display: inline-block; }
.glitch::before, .glitch::after { content: attr(data-t); position: absolute; left: 0; top: 0; width: 100%; overflow: hidden; opacity: 0; }
.glitch::before { color: #b6ffd0; animation: gl1 6s infinite steps(1); }
.glitch::after { color: #0f8f3a; animation: gl2 6s infinite steps(1); }
@keyframes gl1 { 0%, 92%, 100% { opacity: 0; transform: none; } 93% { opacity: .9; transform: translate(-3px, 0); clip-path: inset(0 0 55% 0); } 95% { opacity: .9; transform: translate(2px, 0); clip-path: inset(60% 0 0 0); } }
@keyframes gl2 { 0%, 93%, 100% { opacity: 0; transform: none; } 94% { opacity: .9; transform: translate(3px, 1px); clip-path: inset(30% 0 35% 0); } }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 22px; align-items: baseline; }
.kv .k { color: var(--dim); letter-spacing: .1em; text-transform: uppercase; font-size: .86rem; white-space: nowrap; }
.kv .v { color: var(--g2); overflow-wrap: anywhere; min-height: 1.4em; }
.kv .v.big { font-size: clamp(1.7rem, 5vw, 2.6rem); line-height: 1.1; color: var(--hi); text-shadow: 0 0 16px rgba(57,255,122,.7); }
.kv .v.big.up { color: #c9ffd9; }
.kv .gap { grid-column: 1 / -1; height: 6px; border-bottom: 1px dashed var(--line); margin-bottom: 6px; }
.verdict { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.verdict .vt { font-size: 1.35rem; color: var(--g); text-shadow: 0 0 12px rgba(57,255,122,.6); min-height: 1.4em; }
.verdict .vs { color: var(--g2); min-height: 1.4em; }
.note { margin-top: 10px; color: var(--warn); border-left: 3px solid var(--warn); padding-left: 10px; }

/* Bedienung */
.controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 12px 16px; }
.controls label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; }
select, input { font: 1rem var(--mono); color: var(--g2); background: #000; border: 1px solid var(--line); border-radius: 0; padding: 7px 9px; min-height: 40px; }
select option { background: #000; color: var(--g2); }
input { width: 12em; max-width: 100%; }
input::placeholder { color: #2f7a48; }
.go { font: 1.05rem var(--mono); letter-spacing: .2em; text-transform: uppercase; color: #001a08; background: var(--g); border: 0; padding: 11px 24px; min-height: 44px; cursor: pointer; box-shadow: 0 0 22px rgba(57,255,122,.45); }
.go:hover { background: #7dffab; }
.go:disabled { opacity: .4; cursor: default; }
.go.stop { background: #000; color: var(--g); border: 1px solid var(--g); box-shadow: none; }
.btn { font: .9rem var(--mono); color: var(--g2); background: #000; border: 1px solid var(--line); padding: 6px 12px; min-height: 36px; cursor: pointer; letter-spacing: .06em; }
.btn:hover { border-color: var(--g); }
.btn.danger { color: #ffb3a8; border-color: #6b2318; }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 3px; }
.status { text-align: center; color: var(--g); min-height: 1.4em; letter-spacing: .12em; }
.running .opt { display: none; }

/* Protokoll */
.log { padding: 10px 0 60px; }
.log .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 6px; }
.log h2 { margin: 0; font-weight: 400; font-size: 1rem; color: var(--g); letter-spacing: .12em; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: #ffb3a8; }
.lg { background: var(--panel); border: 1px solid var(--line); padding: 6px 0; font-size: .92rem; }
.lr { display: grid; grid-template-columns: 10.4em minmax(0, 1.4fr) 6.6em minmax(0, 1fr) minmax(0, 1fr); gap: 2px 14px; padding: 6px 14px; align-items: baseline; }
.lr + .lr { border-top: 1px dotted rgba(17,82,42,.8); }
.lr.th { color: var(--dim); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
.lr .t { color: var(--dim); white-space: nowrap; }
.lr .w { overflow-wrap: anywhere; }
.lr .w small, .lr small { color: var(--dim); font-size: .82em; }
.lr .d { color: var(--hi); } .lr .u { color: var(--g2); }
.empty { padding: 10px 14px; color: var(--dim); }
.foot { color: #2f7a48; font-size: .78rem; margin-top: 16px; }

@media (max-width: 760px) {
  body { font-size: 15px; }
  .stage { gap: 16px; min-height: calc(100vh - 70px); }
  .pills { gap: 10px; flex-wrap: nowrap; }
  .pill { width: auto; flex: 1 1 0; padding: 8px 4px; }
  .pill .cap { width: 86px; height: 34px; }
  .or { display: none; }
  .duo { gap: 8px; }
  .duo .slot { height: clamp(128px, 17vh, 170px); }
  .stats div { padding: 7px 8px; }
  .stats b { font-size: .95rem; }
  .kv { gap: 2px 12px; }
  .kv .k { font-size: .74rem; }
  .report { padding: 14px 14px 16px; }
  .lr.th { display: none; }
  .lr { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .lr .t { grid-column: 1 / -1; font-size: .8rem; }
  .lr .w { grid-column: 1 / -1; }
  .lr .p { grid-column: 1 / -1; }
  .lr .p::before { content: "Ping "; color: var(--dim); }
  .lr .d::before { content: "\25BC  "; color: var(--dim); }
  .lr .u::before { content: "\25B2  "; color: var(--dim); }
  .controls label.opt { flex: 1 1 40%; }
  .controls label.opt.lbl { flex-basis: 100%; }
  .controls label.opt select, .controls label.opt input { width: 100%; }
  .go { width: 100%; }
}
.flash .stage { animation: shake .22s steps(2) 1; }
@keyframes shake { 0% { transform: translate(-4px, 1px) skewX(-2deg); filter: brightness(1.6); } 50% { transform: translate(3px, -1px); } 100% { transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .crt, .crt::after, .bar .dot, .glitch::before, .glitch::after, .cur::after { animation: none !important; }
  #rain { transition: none; }
  .flash .stage { animation: none; }
}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="crt" aria-hidden="true"></div>

<div class="wrap">
  <header class="bar">
    <span class="dot" aria-hidden="true"></span>
    <b>Kanal offen</b>
    <span id="host">…</span>
    <span class="meta" id="meta"></span>
    <span class="demo" id="demo" hidden>Demo</span>
  </header>

  <main>
    <section class="stage" id="stage">
      <div id="intro">
        <div class="term" id="introText" aria-label="Willkommen. Wähle eine Kapsel, um die Messung zu starten."></div>
        <div class="pills">
          <button class="pill blue" id="pillBlue" disabled>
            <span class="cap" aria-hidden="true"></span>
            <span class="pl">Blaue Kapsel</span>
            <span class="ps">Kurzer Blick<br>5 Sekunden je Richtung</span>
          </button>
          <span class="or" aria-hidden="true">ODER</span>
          <button class="pill red" id="pillRed" disabled>
            <span class="cap" aria-hidden="true"></span>
            <span class="pl">Rote Kapsel</span>
            <span class="ps">Bis auf den Grund<br>20 Sekunden je Richtung</span>
          </button>
        </div>
      </div>

      <div id="live" hidden>
        <div class="phase"><span id="phase">Verbindung</span><span class="prog" id="prog" aria-hidden="true"></span></div>
        <div class="slot" id="slotLive" aria-hidden="true"></div>
        <div class="readline" aria-live="off">
          <span class="lv" id="liveVal">…</span><span class="lu" id="liveUnit"></span><span class="lp" id="livePeak"></span>
        </div>
        <div class="stats">
          <div><span>Ping</span><b id="sPing">–</b></div>
          <div><span>&#9660; Spitze</span><b id="sDl">–</b></div>
          <div><span>&#9650; Spitze</span><b id="sUl">–</b></div>
        </div>
        <div class="console" id="console"></div>
      </div>

      <div id="result" hidden>
        <div class="duo">
          <div><div class="slot" id="slotDl" aria-hidden="true"></div><div class="cap2">&#9660; Download-Spitze <b id="cDl"></b></div></div>
          <div><div class="slot" id="slotUl" aria-hidden="true"></div><div class="cap2">&#9650; Upload-Spitze <b id="cUl"></b></div></div>
        </div>
        <div class="report" id="report">
          <h2><span class="glitch" data-t="&gt; Befund">&gt; Befund</span></h2>
          <div class="kv" id="kv"></div>
          <div class="verdict"><div class="vt" id="vt"></div><div class="vs" id="vs"></div></div>
          <div class="note" id="note" hidden></div>
        </div>
      </div>

      <div class="controls" id="controls">
        <label class="opt">Dauer
          <select id="duration">
            <option value="5">5 s</option>
            <option value="10" selected>10 s</option>
            <option value="20">20 s</option>
          </select>
        </label>
        <label class="opt">Verbindungen
          <select id="streams">
            <option value="1">1</option><option value="2">2</option><option value="4" selected>4</option><option value="6">6</option><option value="8">8</option>
          </select>
        </label>
        <label class="opt lbl">Gerätename
          <input id="label" maxlength="40" placeholder="z. B. Laptop Büro" autocomplete="off">
        </label>
        <button class="go" id="go" disabled>&#9654; Messung starten</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </section>

    <section class="log" aria-labelledby="logh">
      <div class="head">
        <h2 id="logh">&gt; protokoll --alle</h2>
        <span id="clearWrap"><button class="btn danger" id="clear">Verlauf löschen</button></span>
      </div>
      <div class="lg" id="history"><div class="empty">Noch keine Einträge im Protokoll.</div></div>
      <p class="foot">Werte in Mbit/s, Spitze vor Ø. Gemessen zwischen diesem Gerät und dem Router.</p>
    </section>
  </main>
</div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.SpeedEngine;
  function $(id) { return document.getElementById(id); }
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* =====================================================================
     Zeichenregen: Canvas mit Glyphen-Atlas, Ziffernmaske fängt Zeichen
     ===================================================================== */
  var cv = $('rain'), ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1, cell = 16, cols = 0, rows = 0, atlas = null, T = 16, NG = 0;
  var mask = null, box = null, litA = null, litG = null, litList = [], maskCols = [], maskList = [];
  var drops = [], dir = 1, frozen = false, staticField = [];
  var rainMode = { dens: 0.32, speed: 9 }, rainTarget = { dens: 0.32, speed: 9 };
  var slots = [], maskDirty = true, lastMask = 0;

  var KANA = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
  var GLYPHS = [];   // [zeichen, gespiegelt]
  function glyphSet() {
    var t = document.createElement('canvas'); t.width = t.height = 24;
    var c = t.getContext('2d'), a, b;
    c.font = '20px "MS Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Unifont-JP",monospace';
    c.textBaseline = 'top'; c.fillStyle = '#fff';
    c.fillText('ｱ', 2, 2); a = c.getImageData(0, 0, 24, 24).data; c.clearRect(0, 0, 24, 24);
    c.fillText('ｻ', 2, 2); b = c.getImageData(0, 0, 24, 24).data;
    var same = true, ink = 0;
    for (var i = 3; i < a.length; i += 4) { if (a[i] !== b[i]) same = false; ink += a[i]; }
    var list = [], k;
    if (!same && ink > 0) {
      for (k = 0; k < KANA.length; k++) list.push([KANA.charAt(k), true]);
      for (k = 0; k < 10; k++) list.push(['' + k, k % 3 === 0]);
      'Z:."=*+<>|'.split('').forEach(function (ch) { list.push([ch, false]); });
    } else {
      // Ersatz ohne japanische Schrift: Ziffern, Zeichen und gespiegelte Buchstaben
      for (k = 0; k < 10; k++) { list.push(['' + k, false]); list.push(['' + k, true]); }
      'ZXEKHTVYRSLJ'.split('').forEach(function (ch) { list.push([ch, true]); });
      ':."=*+<>|'.split('').forEach(function (ch) { list.push([ch, false]); });
    }
    return list;
  }
  // Stile im Atlas: 0 dunkel, 1 Spur, 2 Kopf, 3 Ziffer
  var STYLE = [['#0c6a2c', 0], ['#22d65c', 0], ['#e6fff0', 8], ['#a8ffc4', 6]];
  function buildAtlas() {
    T = Math.round(cell * dpr);
    atlas = document.createElement('canvas');
    atlas.width = T * NG; atlas.height = T * STYLE.length;

      typeLine($('note'), '', 999, function () {
        $('note').hidden = false;
        $('note').textContent = '! Ein Prozessorkern des Routers lief mit ' + Math.round(core) + ' % am Anschlag. Das Ergebnis zeigt eher die Grenze des Routers als die des Netzes.';
      });
    }
    loadHistory();
  }

  /* ---------- Protokoll ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function n0(v) { return v === null || v === undefined ? '–' : E.fmt(v, 0); }
  function sp(peak, avg) { return peak === null || peak === undefined ? n0(avg) : n0(peak) + ' <small>/ Ø ' + n0(avg) + '</small>'; }
  function loadHistory() {
    E.history(function (h) {
      if (!h || !h.length) { $('history').innerHTML = '<div class="empty">Noch keine Einträge im Protokoll.</div>'; $('clearWrap').hidden = true; return; }
      $('clearWrap').hidden = false;
      var html = '<div class="lr th"><span>Zeit</span><span>Gerät</span><span>Ping ms</span><span>▼ Spitze / Ø</span><span>▲ Spitze / Ø</span></div>';
      for (var i = h.length - 1; i >= 0; i--) {
        var e = h[i], dt = new Date(e.ts * 1000);
        var when = '[' + ('0' + dt.getDate()).slice(-2) + '.' + ('0' + (dt.getMonth() + 1)).slice(-2) + '. ' + ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2) + ']';
        var who = e.label ? esc(e.label) + (e.host ? ' <small>' + esc(e.host) + '</small>' : '') : esc(e.host || e.ip || '–');
        var ping = e.ping === null || e.ping === undefined ? '–' : E.fmt(e.ping, 1) + (e.jitter !== null && e.jitter !== undefined ? ' <small>±' + E.fmt(e.jitter, 1) + '</small>' : '');
        html += '<div class="lr"><span class="t">' + when + '</span><span class="w">' + who + '</span><span class="p">' + ping +
          '</span><span class="d">' + sp(e.dl_peak, e.dl) + '</span><span class="u">' + sp(e.ul_peak, e.ul) + '</span></div>';
      }
      $('history').innerHTML = html;
    });
  }
  function clearAsk() {
    $('clearWrap').innerHTML = '<span class="confirm">Protokoll wirklich löschen? <button class="btn danger" id="yes">Ja, löschen</button><button class="btn" id="no">Nein</button></span>';
    $('yes').onclick = function () { E.clearHistory(function () { clearReset(); loadHistory(); }); };
    $('no').onclick = function () { clearReset(); $('clear').focus(); };
    $('no').focus();
  }
  function clearReset() { $('clearWrap').innerHTML = '<button class="btn danger" id="clear">Verlauf löschen</button>'; $('clear').onclick = clearAsk; }
  $('clear').onclick = clearAsk;

  /* ---------- Bedienung ---------- */
  $('go').onclick = function () { if (E.running()) stop(); else start(); };
  function pill(sec) { return function () { $('duration').value = '' + sec; start(); }; }
  $('pillBlue').onclick = pill(5);
  $('pillRed').onclick = pill(20);

  try {
    var l = localStorage.getItem('st-label'), s = localStorage.getItem('st-streams'), d = localStorage.getItem('st-duration');
    if (l) $('label').value = l;
    if (s && /^(1|2|4|6|8)$/.test(s)) $('streams').value = s;
    if (d && /^(5|10|20)$/.test(d)) $('duration').value = d;
  } catch (e) { }

  setup();
  kick();

  // Begrüßung
  var intro = $('introText');
  ['> Signal empfangen.', '> Du willst wissen, wie schnell dein Netz wirklich ist.', '> Wähle eine Kapsel.'].forEach(function (t, i) {
    var p = document.createElement('p'); intro.appendChild(p); typeLine(p, t, i === 1 ? 95 : 60);
  });

  E.init(function (info) {
    $('host').textContent = info.hostname || 'Router';
    var meta = (info.model ? info.model + ' · ' : '') + (info.cores ? info.cores + ' Kerne · ' : '') + 'Du: ' +
      (info.client_host ? info.client_host + ' (' + info.client_ip + ')' : (info.client_ip || '?'));
    $('meta').textContent = meta;
    $('demo').hidden = !info.demo;
    $('go').disabled = false; $('pillBlue').disabled = false; $('pillRed').disabled = false;
    loadHistory();
  });
})();
</script>
</body>
</html>
